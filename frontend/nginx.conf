# Repositorio SCSL - servidor web del frontend
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 60m;   # informes PDF de hasta 50 MB

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /salud { access_log off; return 200 "ok\n"; }

    # Archivos con huella en el nombre: se guardan en cache un anio.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Logo y foto institucional: si faltan, 404 y la pantalla usa su respaldo.
    # no-cache: el navegador revalida (304 si no cambio), asi se ve al instante un logo o foto nuevos.
    location /marca/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # API del backend (contenedor "app"). Se resuelve al momento de cada peticion,
    # asi Nginx arranca aunque el backend todavia no exista.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://app:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Aplicacion de una sola pagina: toda ruta desconocida carga index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
